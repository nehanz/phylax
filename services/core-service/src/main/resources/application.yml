# Server configuration
server:
  port: 8081
  error:
    include-message: always

# Application identity
spring:
  application:
    name: core-service

# Actuator configuration (health check endpoints)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging
logging:
  level:
    com.phylax: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%thread] - %logger{36} - %msg%n"

# Custom Phylax settings
phylax:
  version: "0.1.0"